[package]
name = "bg_removal"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Smart background removal in pure Rust (BiRefNet segmentation + edge refinement)"

[dependencies]
gemm = "0.19.0"
rayon = "1.12.0"
half = "2.7.1"
safetensors = "0.8.0"
libm = "0.2.16"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "rayon"] }


[[bin]]
name = "bgremove"
path = "src/main.rs"
