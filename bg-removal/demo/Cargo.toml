[package]
name = "bgremove_demo"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "BgRemoveDemo"
path = "src/main.rs"

[dependencies]
bg_removal = { path = ".." }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "rayon"] }
rfd = "0.17.2"
